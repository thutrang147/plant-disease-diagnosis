seed: 42

data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  image_size: 224
  batch_size: 32
  num_workers: 4

model:
  name: resnet18 # resnet18 or vit_b_16
  pretrained: true

training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  device: auto
  checkpoint_dir: checkpoints
